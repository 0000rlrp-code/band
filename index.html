<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2B3A55">
<title>HanDler 합주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#2B3A55; --ink:#1f2937; --mute:#6b7280; --line:#e3e7ee; --bg:#f4f6fa; --card:#fff;
          --o:#1e7b34; --ob:#e6f4ea; --t:#b45f06; --tb:#fff1dc; --x:#b91c1c; --xb:#fde8e8; --teal:#0f5e6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 16px calc(80px + env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin:6px 0 14px; }
  h1 { font-size:22px; margin:0 0 4px; color:var(--navy); }
  .sub { margin:0; color:var(--mute); font-size:14px; line-height:1.55; }
  .refresh { flex:none; border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px;
             font:inherit; font-size:13px; color:var(--navy); cursor:pointer; min-height:36px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .who { position:sticky; top:0; z-index:5; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .label { font-size:13px; color:var(--mute); margin-bottom:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:10px 16px; font:inherit; font-size:16px;
          cursor:pointer; min-height:44px; color:var(--ink); }
  .chip small { color:var(--mute); margin-left:4px; font-size:12px; }
  .chip.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .chip.on small { color:#cbd5e1; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .date { font-size:19px; font-weight:700; }
  .time { color:var(--mute); font-size:14px; white-space:nowrap; }
  .meta { font-size:13px; color:var(--mute); margin:4px 0 12px; }
  .badge { display:inline-block; vertical-align:middle; font-size:12px; font-weight:500; padding:2px 8px; border-radius:999px;
           background:var(--ob); color:var(--o); margin-left:6px; }
  .badge.late { background:var(--xb); color:var(--x); }
  .btns { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .btn { border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:10px 4px; font:inherit; font-size:14px;
         cursor:pointer; min-height:64px; color:var(--ink); transition:transform .08s; }
  .btn b { display:block; font-size:22px; line-height:1.2; }
  .btn:active { transform:scale(.97); }
  .btn.O.on { background:var(--ob); border-color:var(--o); color:var(--o); }
  .btn.T.on { background:var(--tb); border-color:var(--t); color:var(--t); }
  .btn.X.on { background:var(--xb); border-color:var(--x); color:var(--x); }
  .btn:disabled { opacity:.4; cursor:default; }
  .others { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px; background:var(--bg); color:var(--mute); }
  .pill.O { background:var(--ob); color:var(--o); }
  .pill.T { background:var(--tb); color:var(--t); }
  .pill.X { background:var(--xb); color:var(--x); }
  /* 빈방 표: 시간대마다 한 줄, 왼쪽 시간 · 오른쪽 드림/별나무 방 칩 */
  .rooms { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .rh { display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; font-weight:700; margin-bottom:4px; }
  .rs { display:grid; grid-template-columns:58px 1fr; gap:8px; padding:8px 0; border-top:1px solid #eef1f5; }
  .rh + .rs, details .rs:first-of-type { border-top:0; }
  .rs.best { background:var(--ob); border-radius:10px; padding:8px; margin:2px -8px; border-top:0; }
  .rs.best + .rs { border-top:0; }
  .rt { font-size:14px; font-weight:700; color:var(--navy); line-height:1.35; }
  .rt em { display:block; font-style:normal; font-size:11px; color:var(--o); }
  .rr > div { display:grid; grid-template-columns:38px 1fr; align-items:start; margin:2px 0; }
  .rk { font-size:11.5px; color:var(--mute); padding-top:3px; }
  .rcs { display:flex; flex-wrap:wrap; gap:4px; }
  .rc { font-size:12.5px; padding:2px 8px; border-radius:6px; background:#e7f0f7; color:#1d4f7a; white-space:nowrap; }
  .rc.s { background:#f1ebfa; color:#5b3b8c; }
  .no { font-size:12px; color:#aab0ba; padding-top:2px; }
  .rooms details summary { font-size:12.5px; color:var(--mute); cursor:pointer; padding:8px 0 2px; }
  .rnote { font-size:12px; color:var(--mute); margin-top:4px; }
  .empty, .loading, .error { text-align:center; color:var(--mute); padding:32px 8px; line-height:1.6; }
  .error { color:var(--x); }
  .skel { height:150px; border-radius:16px; background:linear-gradient(90deg,#eceff4 25%,#f6f7fa 50%,#eceff4 75%);
          background-size:200% 100%; animation:sh 1.2s infinite; margin-bottom:12px; }
  @keyframes sh { to { background-position:-200% 0; } }
  .tabs { display:none; grid-template-columns:1fr 1fr 1fr; gap:6px; background:#e8ecf3; padding:4px; border-radius:12px; margin-bottom:12px; }
  .tabs.show { display:grid; }
  .tab { border:0; background:transparent; border-radius:9px; padding:10px; font:inherit; font-size:15px; color:var(--mute); cursor:pointer; min-height:42px; }
  .tab.on { background:#fff; color:var(--navy); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  /* 예약 전에 꼭 누르도록 눈에 띄게: 청록 카드 + 큰 버튼 */
  .chk { display:flex; flex-direction:column; gap:8px; margin:0 0 12px; padding:14px; border-radius:16px;
         background:#e6f4f1; border:1.5px solid #0f766e; font-size:13.5px; color:#0f5e57; }
  .chk::before { content:"예약하기 전에 빈방을 새로 확인해 주세요"; font-weight:700; font-size:15px; color:#0f5e57; }
  .chkbtn { width:100%; border:0; background:#0f766e; color:#fff; border-radius:12px; padding:12px; font:inherit; font-size:16px;
            font-weight:700; cursor:pointer; min-height:50px; box-shadow:0 2px 8px rgba(15,118,110,.25); }
  .chkbtn:active { transform:scale(.98); }
  .chkbtn:disabled { opacity:.55; cursor:default; box-shadow:none; }
  .hide { display:none !important; }
  .sum { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .sum .big { grid-column:1 / -1; }
  .stat .k { font-size:12px; color:var(--mute); }
  .stat .v { font-size:18px; font-weight:700; margin-top:2px; }
  .stat.big .v { font-size:28px; color:var(--navy); }
  .warn { color:var(--x); }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .seg button { border:1.5px solid var(--line); background:#fff; border-radius:12px; min-height:48px; font:inherit; font-size:16px; cursor:pointer; color:var(--ink); }
  .seg .in.on { background:var(--ob); border-color:var(--o); color:var(--o); font-weight:700; }
  .seg .out.on { background:var(--xb); border-color:var(--x); color:var(--x); font-weight:700; }
  .field { margin-bottom:12px; }
  .field > .label { margin-bottom:6px; }
  .amount { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; font-size:24px; font-weight:700; text-align:right; }
  .amount:focus, .text:focus, .datein:focus { outline:none; border-color:var(--navy); }
  .quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .quick button, .pick { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; min-height:38px; color:var(--ink); }
  .pick.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .text, .datein { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; font:inherit; font-size:16px; background:#fff; }
  .save { width:100%; border:0; border-radius:14px; background:var(--navy); color:#fff; font:inherit; font-size:17px; font-weight:700; min-height:54px; cursor:pointer; }
  .save:disabled { opacity:.5; }
  .tx { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .tx:last-child { border-bottom:0; }
  .tx .d { color:var(--mute); font-size:12px; }
  .tx .amt { font-weight:700; white-space:nowrap; }
  .tx .amt.in { color:var(--o); }
  .tx .amt.out { color:var(--x); }
  .undo { border:0; background:transparent; color:#93c5fd; font:inherit; font-size:14px; margin-left:10px; cursor:pointer; text-decoration:underline; pointer-events:auto; }
  .checked { color:var(--mute); font-size:11.5px; }
  .next { background:var(--navy); color:#fff; border-color:var(--navy); }
  .next .k { font-size:13px; opacity:.8; }
  .next .v { font-size:22px; font-weight:700; margin-top:4px; }
  .notice p { margin:0 0 8px; font-size:14.5px; line-height:1.6; }
  .notice p:first-child { font-weight:700; color:var(--navy); }
  .next .w { font-size:14px; margin-top:6px; opacity:.9; }
  .bk { margin:-4px 0 12px; padding:8px 10px; border-radius:10px; background:var(--ob); color:var(--o); font-size:13.5px; font-weight:500; }
  .tm { display:flex; align-items:center; gap:6px; margin-top:10px; padding:10px; border-radius:12px; background:var(--bg); flex-wrap:wrap; }
  .tm .lb { font-size:13px; color:var(--mute); margin-right:2px; }
  .tm select { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:8px 6px; font:inherit; font-size:15px; min-height:40px; color:var(--ink); }
  .tm .clr { border:0; background:transparent; color:var(--mute); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; margin-left:auto; }
  .ov { margin-top:10px; font-size:13.5px; color:var(--o); font-weight:500; }
  .ov.none { color:var(--x); }
  .pm { display:flex; justify-content:space-between; padding:7px 0; font-size:14px; border-bottom:1px solid var(--line); }
  .pm:last-child { border-bottom:0; }
  .bkbtn { margin-top:12px; width:100%; border:1.5px dashed var(--navy); background:#fff; color:var(--navy); border-radius:12px;
           font:inherit; font-size:14px; min-height:40px; cursor:pointer; }
  .bkform { margin-top:10px; padding:12px; border-radius:12px; background:var(--bg); }
  .bkform .r { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .bkform .lb { width:52px; flex:none; font-size:13px; color:var(--mute); }
  .bkform select, .bkform input { flex:1; min-width:0; border:1.5px solid var(--line); background:#fff; border-radius:10px;
                                  padding:8px; font:inherit; font-size:16px; min-height:40px; color:var(--ink); }
  .bkform input { text-align:right; font-weight:700; }
  .bkform .sep { flex:none; color:var(--mute); }
  .bksave { width:100%; border:0; border-radius:12px; background:var(--navy); color:#fff; font:inherit; font-size:16px;
            font-weight:700; min-height:44px; cursor:pointer; margin-top:4px; }
  .bksave:disabled { opacity:.5; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--navy);
           color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>HanDler</h1>
      <p class="sub" id="sub">되는 날은 O, 늦게 오거나 일찍 가면 △, 안 되면 X. 되는 시간도 30분 단위로 고를 수 있고, 시간을 고르면 자동으로 O가 돼요.</p>
    </div>
    <button class="refresh" id="refresh">새로고침</button>
  </header>
  <div class="tabs show" id="tabs"><button class="tab on" data-tab="vote">날짜 체크</button><button class="tab" data-tab="dues">회비</button><button class="tab" data-tab="info">합주</button></div>
  <div id="voteView">
    <div id="nextTop"></div>
    <div class="box who"><div class="label">나는 (한 번 고르면 다음에도 기억해요)</div><div id="members" class="chips"></div></div>
    <div class="chk"><span id="chkText"></span><button class="chkbtn" id="chkBtn">빈방 새로고침 (1~2분)</button></div>
    <div id="list"><div class="skel"></div><div class="skel"></div></div>
  </div>
  <div id="duesView" class="hide">
    <div class="box sum" id="duesSum"><div class="skel big" style="height:70px;margin:0"></div></div>
    <div class="box hide" id="duesForm">
      <div class="seg"><button class="in on" data-type="in">입금</button><button class="out" data-type="out">지출</button></div>
      <div class="field"><div class="label">금액</div>
        <input class="amount" id="amount" inputmode="numeric" placeholder="0" autocomplete="off">
        <div class="quick" id="quick"></div></div>
      <div class="field"><div class="label">분류</div><div class="chips" id="cats"></div></div>
      <div class="field" id="whoField"><div class="label">입금자</div><div class="chips" id="payers"></div></div>
      <div class="field"><div class="label">날짜</div><input class="datein" id="date" type="date"></div>
      <div class="field"><div class="label">메모 (선택)</div><input class="text" id="memo" placeholder="예: 11월 회비, 여준 지각" autocomplete="off"></div>
      <button class="save" id="save">입금 저장</button>
    </div>
    <div class="box"><div class="label">최근 내역</div><div id="recent"></div></div>
    <div class="box" id="perMemberBox"><div class="label">멤버별 납부 (입금자가 적힌 것만)</div><div id="perMember"></div></div>
  </div>
  <div id="infoView" class="hide">
    <div id="nextBox"><div class="skel" style="height:90px"></div></div>
  </div>
</div>
<div id="toast"></div>
<script>
var API = "https://script.google.com/macros/s/AKfycbzolxaqJC1C6ajQiohXvnAMPKhFrmIiqsim2HHJbIddXmoSkAFq5GW6d3mi14z8E0q_/exec";
var CODE = "x1oqlhgs0dzjfcnv";
var DATA = null;
var me = "";
var pending = 0;
try { me = localStorage.getItem("band_member") || ""; } catch (e) {}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; });
}
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.pointerEvents = "none";
  t.className = "show";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.className = ""; }, 1800);
}
function cls(v) { return v === "O" ? "O" : v === "△" ? "T" : v === "X" ? "X" : ""; }

function load(quiet) {
  if (!quiet) document.getElementById("list").innerHTML = '<div class="skel"></div><div class="skel"></div>';
  return fetch(API + "?action=vote&mc=" + encodeURIComponent(CODE))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      DATA = d;
      render();
      renderInfo();
      if (quiet === "button") toast("최신으로 바꿨어요");
      if (d.refreshPending && !refreshing) watchRefresh(d.checkedAt || ""); // 다른 사람이 누른 빈방 확인이 진행 중
    })
    .catch(function (e) {
      if (quiet === "silent" && DATA) return; // 빈방 확인을 기다리는 동안 한 번 실패해도 화면은 그대로 둔다
      document.getElementById("list").innerHTML =
        '<div class="box error">불러오지 못했어요.<br>' + esc(e.message || "") + '<br>잠시 뒤 새로고침해 주세요.</div>';
    });
}

// ---------- 빈방 새로고침 (누르면 서버가 1분 안에 다시 확인한다) ----------
var refreshing = false, refreshSending = false, refreshTimer = 0;

function updateBar() {
  var txt = document.getElementById("chkText"), btn = document.getElementById("chkBtn");
  txt.textContent = refreshing ? "확인 중… (1~2분)" : !DATA ? "" : DATA.checkedAt ? "빈방 기준 " + DATA.checkedAt : "빈방 아직 확인 전";
  btn.disabled = refreshing || refreshSending;
}

function stopRefresh() {
  refreshing = false;
  clearTimeout(refreshTimer);
  updateBar();
}

// 30초마다 조용히 다시 읽어서 확인 시각이 base에서 바뀌면 끝, 5분이 지나면 포기한다
function watchRefresh(base) {
  var started = Date.now();
  refreshing = true;
  clearTimeout(refreshTimer);
  updateBar();
  function tick() {
    refreshTimer = setTimeout(function () {
      load("silent").then(function () {
        if (!refreshing) return;
        if (DATA && (DATA.checkedAt || "") !== base) { stopRefresh(); toast("빈방을 새로 확인했어요"); return; }
        if (Date.now() - started >= 5 * 60 * 1000) { stopRefresh(); toast("아직 확인 중이에요. 잠시 뒤 새로고침해 주세요"); return; }
        tick();
      });
    }, 30000);
  }
  tick();
}

function refreshRooms() {
  if (refreshing || refreshSending || !DATA) return;
  var base = DATA.checkedAt || "";
  refreshSending = true;
  updateBar();
  fetch(API, {method: "POST", body: JSON.stringify({action: "refresh", c: CODE})})
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      refreshSending = false;
      if (d.status === "recent") { updateBar(); toast((d.checked || "방금") + "에 막 확인했어요. 10분 뒤에 다시 눌러 주세요"); return; }
      watchRefresh(base);
    })
    .catch(function (e) {
      refreshSending = false;
      updateBar();
      toast(e.message || "요청하지 못했어요");
    });
}

// 09:00 ~ 24:00, 30분 단위. 시작 칸에는 24:00을 빼고, 끝 칸에는 09:00을 뺀다.
function timeSelect(which, value) {
  var opts = ['<option value="">' + (which === "from" ? "부터" : "까지") + "</option>"];
  for (var m = 9 * 60; m <= 24 * 60; m += 30) {
    if ((which === "from" && m === 24 * 60) || (which === "to" && m === 9 * 60)) continue;
    var t = ("0" + Math.floor(m / 60)).slice(-2) + ":" + ("0" + (m % 60)).slice(-2);
    opts.push('<option value="' + t + '"' + (t === value ? " selected" : "") + ">" + t + "</option>");
  }
  return '<select data-which="' + which + '">' + opts.join("") + "</select>";
}

function saveTime(row, date, from, to) {
  pending++;
  fetch(API, {method: "POST", body: JSON.stringify({action: "vote", kind: "time", c: CODE, member: me, row: row, date: date, from: from, to: to})})
    .then(function (r) { return r.json(); })
    .then(function (d) {
      pending--;
      if (d.error) throw new Error(d.error);
      if (!pending) { DATA = d; render(); }
      toast(from ? "시간을 저장했어요" : "시간 상관없음으로 바꿨어요");
    })
    .catch(function (e) {
      pending = Math.max(0, pending - 1);
      toast(e.message || "저장하지 못했어요");
      load(true);
    });
}

document.addEventListener("change", function (ev) {
  var sel = ev.target.closest(".tm select");
  if (!sel) return;
  var box = sel.closest(".tm");
  var from = box.querySelector('[data-which="from"]').value;
  var to = box.querySelector('[data-which="to"]').value;
  if (!from || !to) return; // 둘 다 고르면 저장
  if (from >= to) { toast("끝 시간이 시작보다 늦어야 해요"); return; }
  var row = Number(box.getAttribute("data-row")), date = box.getAttribute("data-date");
  var cur = "";
  DATA.dates.forEach(function (x) { if (x.row === row) cur = x.answers[me] || ""; });
  if (cur) { saveTime(row, date, from, to); return; }
  // 아직 답이 없으면 O를 먼저 저장하고 시간을 저장한다
  DATA.dates.forEach(function (x) { if (x.row === row) x.answers[me] = "O"; });
  pending++;
  fetch(API, {method: "POST", body: JSON.stringify({action: "vote", c: CODE, member: me, row: row, date: date, value: "O"})})
    .then(function (r) { return r.json(); })
    .then(function (d) {
      pending--;
      if (d.error) throw new Error(d.error);
      saveTime(row, date, from, to);
    })
    .catch(function (e) {
      pending = Math.max(0, pending - 1);
      toast(e.message || "저장하지 못했어요");
      load(true);
    });
});

document.addEventListener("click", function (ev) {

  if (!clr) return;

  saveTime(Number(box.getAttribute("data-row")), box.getAttribute("data-date"), "", "");

// 시간 칸이 비어 있으면 멤버 시간이 겹친 추천 시간, 그것도 없으면 '시간 미정'
function parseRange(str) {
  var m = String(str || "").match(/(\d{1,2})(?::(\d{2}))?\s*[~\-]\s*(\d{1,2})(?::(\d{2}))?/);
  if (!m) return null;
  var s = Number(m[1]) + (Number(m[2] || 0) > 0 ? 1 : 0); // 시작은 올림
  var e = Number(m[3]);                                    // 끝은 내림
  return {s: s, e: e};
}

// 드림·별나무 빈방 글을 시간대별 목록 [{s, e, rooms}]로 바꾼다(같은 시간대는 드림 다음 별나무 순으로 합침)
function roomSlots(d) {
  var slots = [];
  [siteSlots(d, d.dream), siteSlots(d, d.startree)].forEach(function (list) {
    list.forEach(function (g) {
      var same = slots.filter(function (x) { return x.s === g.s && x.e === g.e; })[0];
      if (!same) slots.push({s: g.s, e: g.e, rooms: g.rooms.slice()});
      else g.rooms.forEach(function (r) { if (same.rooms.indexOf(r) === -1) same.rooms.push(r); });
    });
  });
  slots.sort(function (a, b) { return a.s - b.s || a.e - b.e; });
  return slots;
}

// 한 곳(드림 또는 별나무)의 빈방 글 -> [{s, e, rooms}]. '빈방 없음'·'확인 실패'·빈칸이면 []
function siteSlots(d, txt) {
  txt = String(txt || "").trim();
  if (!txt || txt === "빈방 없음" || txt.indexOf("확인 실패") === 0) return [];
  function splitRooms(t) {
    return String(t || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean);
  }
  var parts = txt.split(" · ");
  if (/^\d{1,2}~\d{1,2}시\s/.test(parts[0])) {
    return parts.map(function (p) {
      var m = p.trim().match(/^(\d{1,2})~(\d{1,2})시\s+(.+)$/);
      return m ? {s: Number(m[1]), e: Number(m[2]), rooms: splitRooms(m[3])} : null;
    }).filter(Boolean);
  }
  var w = parseRange(d.time || d.suggest);
  return w && w.e > w.s ? [{s: w.s, e: w.e, rooms: splitRooms(txt)}] : [];
}

// 빈방 표. 겹치는 시간 안의 시간대를 먼저 보이고, 나머지는 접어 둔다. 추천 시간대는 초록으로.
function roomTable(d, sg) {
  var dr = siteSlots(d, d.dream), st = siteSlots(d, d.startree);
  var keys = roomSlots(d).map(function (g) { return {s: g.s, e: g.e}; });
  var ov = parseRange(d.overlap);
  var inOv = function (g) { return ov && ov.e - ov.s >= 2 && g.s >= ov.s && g.e <= ov.e; };
  function find(list, g) {
    var hit = list.filter(function (x) { return x.s === g.s && x.e === g.e; })[0];
    return hit ? hit.rooms : [];
  }
  function chips(rooms, c) {
    return rooms.length ? '<div class="rcs">' + rooms.map(function (r) { return '<span class="rc ' + c + '">' + esc(r) + "</span>"; }).join("") + "</div>"
                        : '<span class="no">없음</span>';
  }
  function row(g) {
    var best = sg && sg.s === g.s && sg.e === g.e;
    return '<div class="rs' + (best ? " best" : "") + '"><div class="rt">' + g.s + "~" + g.e + "시" + (best ? "<em>추천</em>" : "") + "</div>" +
      '<div class="rr"><div><span class="rk">드림</span>' + chips(find(dr, g), "d") + "</div>" +
      '<div><span class="rk">별나무</span>' + chips(find(st, g), "s") + "</div></div></div>";
  }
  var main = ov && ov.e - ov.s >= 2 ? keys.filter(inOv) : keys;
  if (main.length > 4) { // 너무 길면 선호 시간대(16~19시)에 가까운 4개만 펼친다
    var gap = function (g) { return Math.max(0, PREF_START - g.s) + Math.max(0, g.e - PREF_END); };
    main = main.slice().sort(function (a, b) { return gap(a) - gap(b) || a.s - b.s; }).slice(0, 4)
               .sort(function (a, b) { return a.s - b.s; });
  }
  var rest = keys.filter(function (g) { return main.indexOf(g) === -1; });
  // 한 곳 전체가 '빈방 없음'이나 '확인 실패'면 표 아래에 한 줄로 알린다
  var notes = [["드림", d.dream], ["별나무", d.startree]].filter(function (x) {
    var t = String(x[1] || "").trim();
    return t && (t === "빈방 없음" || t.indexOf("확인 실패") === 0);
  }).map(function (x) { return x[0] + ": " + String(x[1]).trim(); });
  return '<div class="rooms"><div class="rh"><span>빈방 (2시간 기준)</span>' +
    (d.checked ? '<span class="checked">' + esc(shortTime(d.checked)) + " 기준</span>" : "") + "</div>" +
    (main.length ? main.map(row).join("") : '<div class="rnote">' + (ov ? "겹치는 시간 안에는 빈방이 없어요." : "빈방이 없어요.") + "</div>") +
    (rest.length ? "<details><summary>" + (main.length ? "다른 시간 " : "겹치는 시간 밖 ") + rest.length + "개 더 보기</summary>" +
      rest.map(row).join("") + "</details>" : "") +
    (notes.length ? '<div class="rnote">' + esc(notes.join(" · ")) + "</div>" : "") + "</div>";
}

// 멤버 시간이 겹치고 빈방도 있는 가장 이른 시간대. 시간이 정해졌으면 null, 확인 전이면 null, 맞는 곳이 없으면 false
function smartSuggest(d) {
  if (d.time) return null;
  var ov = parseRange(d.overlap);
  if (!ov || ov.e - ov.s < 2) return null;
  var checked = String(d.dream || "").trim() !== "" || String(d.startree || "").trim() !== "";
  if (!checked) return null;
  // 빈방이 있는 구간 중 팀 선호 시간대(16~19시)에 가장 가까운 것. 같으면 이른 시간.
  var slots = roomSlots(d), best = null, bestGap = 99;
  for (var i = 0; i < slots.length; i++) {
    var g = slots[i];
    if (g.s >= ov.s && g.e <= ov.e && g.rooms.length) {
      var gap = Math.max(0, PREF_START - g.s) + Math.max(0, g.e - PREF_END);
      if (gap < bestGap || (gap === bestGap && g.s < best.s)) { best = g; bestGap = gap; }
    }
  }
  return best ? {s: best.s, e: best.e, rooms: best.rooms} : false;
}
var PREF_START = 16, PREF_END = 19; // 팀이 선호하는 합주 시간대

// 시트에서 날짜 객체 글('Fri Oct 30 2026 18:08:00 GMT+0900 …')로 올 때도 '10/30 18:08'로 줄인다
function shortTime(v) {
  var s = String(v || "");
  if (/^\d{1,2}\/\d{1,2} \d{1,2}:\d{2}$/.test(s)) return s;
  var t = new Date(s.replace(/\s*\(.*\)$/, ""));
  return isNaN(t) ? s : (t.getMonth() + 1) + "/" + t.getDate() + " " + pad2(t.getHours()) + ":" + pad2(t.getMinutes());
}

function hourRange(g) { return pad2(g.s) + ":00~" + pad2(g.e) + ":00"; }

// 시간 칸이 비어 있으면 겹치는 시간 중 빈방이 있는 추천 시간, 아직 모르면 겹침 추천, 그것도 없으면 '시간 미정'
function timeLabel(d) {
  if (d.time) return d.time;
  var g = smartSuggest(d);
  if (g) return "추천 " + hourRange(g);
  if (g === false) return "시간 미정";
  return d.suggest ? "추천 " + d.suggest + " (빈방 확인 전)" : "시간 미정";
}

function bookingText(d) {
  var b = d.booking;
  if (!b) return "예약 완료";
  return "예약 완료 · " + [b.place, b.room].filter(Boolean).join(" ");
}

function nextCard(d) {

    (d.booking ? '<div class="w">' + esc([d.booking.place, d.booking.room].filter(Boolean).join(" ")) + "</div>" : "") + "</div>";
}

  var list = document.getElementById("list");

    list.innerHTML = '<div class="box empty">아직 후보 날짜가 없어요.<br>후보가 올라오면 여기에 나타나요.</div>';
    return;
  }
  // 드림·별나무 둘 다 '빈방 없음'인 날은 예약할 수 없으니 숨긴다(예약 완료된 날은 그대로)
  var full = function (d) { return d.status !== "예약 완료" && d.dream === "빈방 없음" && d.startree === "빈방 없음"; };
  var shown = DATA.dates.filter(function (d) { return !full(d); });
  var hidden = DATA.dates.length - shown.length;
  list.innerHTML = (me ? "" : '<div class="box empty">위에서 먼저 이름을 골라 주세요.</div>') +
    (hidden ? '<div class="checked" style="margin:0 0 10px 4px">드림·별나무 모두 빈방이 없는 날 ' + hidden + "개는 숨겼어요.</div>" : "") +
    shown.map(function (d) {
    var mine = me ? (d.answers[me] || "") : "";
    var ok = names.filter(function (n) { return d.answers[n] === "O" || d.answers[n] === "△"; }).length;
    var badge = d.status === "예약 완료" ? '<span class="badge">예약 완료</span>'
              : (d.dueOver ? '<span class="badge late">응답 마감 지남</span>' : "");
    function btn(v, c, text) {
      return '<button class="btn ' + c + (mine === v ? " on" : "") + '" data-row="' + d.row + '" data-date="' + d.date +
        '" data-v="' + v + '"' + (me ? "" : " disabled") + "><b>" + v + "</b>" + text + "</button>";
    }
    var others = names.map(function (n) {
      var v = d.answers[n] || "";
      var t = (v === "O" || v === "△") && d.times && d.times[n] ? " " + d.times[n] : "";
      return '<span class="pill ' + cls(v) + '">' + esc(n) + " " + (v || "-") + esc(t) + "</span>";
    }).join("");
    var timeRow = "";
    if (me && mine !== "X" && d.status !== "예약 완료") { // 아직 답 안 한 날도 보인다. 시간을 고르면 자동으로 O
      var cur = (d.times && d.times[me] || "").split("~");
      timeRow = '<div class="tm" data-row="' + d.row + '" data-date="' + d.date + '"><span class="lb">내 가능 시간</span>' +
        timeSelect("from", cur[0] || "") + "<span>~</span>" + timeSelect("to", cur[1] || "") +
        (cur[0] ? '<button class="clr">상관없음</button>' : "") + "</div>";
    }
    var ov = "";
    if (d.overlap) {
      var sg = smartSuggest(d);
      if (sg) {
        ov = '<div class="ov">겹치는 시간 ' + esc(d.overlap) + " · 추천 " + esc(hourRange(sg)) + "</div>";
      } else if (sg === false) {
        ov = '<div class="ov none">겹치는 시간 ' + esc(d.overlap) + " · 이 시간대엔 빈방이 없어요</div>";
      } else {
        ov = '<div class="ov' + (d.suggest ? "" : " none") + '">겹치는 시간 ' + esc(d.overlap) +
          (d.suggest ? " · 추천 " + esc(d.suggest) : " · 2시간이 안 돼요") + "</div>";
      }
    }
    var rooms = "";
    if (d.status !== "예약 완료" && (d.dream || d.startree)) rooms = roomTable(d, smartSuggest(d));
    return '<div class="box"><div class="top"><div class="date">' + esc(d.label) + badge + '</div><div class="time">' +
      esc(timeLabel(d)) + "</div></div>" +
      '<div class="meta">' + (d.due ? "응답 마감 " + esc(d.due) + " · " : "") + "가능 " + ok + "/" + names.length + "명</div>" +
      (d.status === "예약 완료" ? '<div class="bk">' + esc(bookingText(d)) + "</div>" : "") +
      '<div class="btns">' + btn("O", "O", "가능") + btn("△", "T", "늦게·일찍") + btn("X", "X", "불가") + "</div>" +
      timeRow + '<div class="others">' + others + "</div>" + ov + rooms + bookUi(d) + "</div>";
  }).join("");
}

    .then(function (r) { return r.json(); })
    .then(function (d) {
      pending--;
      if (d.error) throw new Error(d.error);
      if (!pending) { DATA = d; render(); }
      toast(value ? "저장했어요" : "지웠어요");

      pending = Math.max(0, pending - 1);
      DATA.dates.forEach(function (x) { if (x.row === row) x.answers[me] = prev; });

      toast(e.message || "저장하지 못했어요");

}

  }).join("") : '<div class="empty">내역이 없어요</div>';
  var pm = DUES.perMember || [];
  document.getElementById("perMemberBox").className = "box" + (pm.length ? "" : " hide");
  document.getElementById("perMember").innerHTML = pm.map(function (m) {
    return '<div class="pm"><span>' + esc(m.name) + "</span><b>" + won(m.amount) + "</b></div>";
  }).join("");
  var canEdit = !!(ADMIN && DUES.catsIn);
  document.getElementById("duesForm").className = "box" + (canEdit ? "" : " hide");
  if (canEdit) renderDuesForm();
}

function renderDuesForm() {
  [].forEach.call(document.querySelectorAll(".seg button"), function (b) {
    var t = b.getAttribute("data-type");
    b.className = t + (t === dtype ? " on" : "");
  });
  document.getElementById("quick").innerHTML = QUICK[dtype].map(function (n) {
    return '<button data-amt="' + n + '">' + won(n) + "</button>";
  }).join("");
  var cats = dtype === "in" ? DUES.catsIn : DUES.catsOut;
  if (cats.indexOf(cat) === -1) cat = cats[0] || "";
  document.getElementById("cats").innerHTML = cats.map(function (c) {
    return '<button class="pick' + (c === cat ? " on" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + "</button>";
  }).join("");
  document.getElementById("whoField").className = "field" + (dtype === "in" ? "" : " hide");
  document.getElementById("payers").innerHTML = DUES.payers.map(function (p) {
    return '<button class="pick' + (p === payer ? " on" : "") + '" data-payer="' + esc(p) + '">' + esc(p) + "</button>";
  }).join("");
  document.getElementById("save").textContent = (dtype === "in" ? "입금" : "지출") + " 저장";
}

function saveDues() {
  var amount = amountValue();
  var date = document.getElementById("date").value || today();
  var extra = document.getElementById("memo").value.trim();
  if (!amount) { toast("금액을 넣어 주세요"); return; }
  if (saving) return;
  saving = true;
  document.getElementById("save").disabled = true;
  var body = {action: "dues_add", a: ADMIN, type: dtype, date: date, amount: amount,
              memo: [cat, extra].filter(Boolean).join(" "), who: dtype === "in" ? payer : ""};
  fetch(API, {method: "POST", body: JSON.stringify(body)})
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      DUES = d;
      lastAdded = d.added;
      setAmount(0);
      document.getElementById("memo").value = "";
      renderDues();
      toastUndo((dtype === "in" ? "입금 " : "지출 ") + won(amount) + " 저장했어요");
    })
    .catch(function (e) { toast(e.message || "저장하지 못했어요"); })
    .then(function () { saving = false; document.getElementById("save").disabled = false; });
}

function undoDues() {
  if (!lastAdded) return;
  var body = {action: "dues_undo", a: ADMIN, type: lastAdded.type, row: lastAdded.row, date: lastAdded.date, amount: lastAdded.amount};
  lastAdded = null;
  fetch(API, {method: "POST", body: JSON.stringify(body)})
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      DUES = d;
      renderDues();
      toast("되돌렸어요");
    })
    .catch(function (e) { toast(e.message || "되돌리지 못했어요"); });
}

// ---------- 예약 완료 처리 (관리자만) ----------
var bookingOpenRow = 0, bookForm = null, bookSaving = false;
var BOOK_SITES = [{v: "dream", n: "드림합주실 신촌"}, {v: "startree", n: "별나무합주실"}];
var BOOK_ROOMS = {
  dream: ["본점 V", "본점 A", "본점 B", "본점 C", "연대점 R", "연대점 Q", "연대점 F"],
  startree: ["V", "R", "Y", "T", "J"]
};
var BOOK_PRICE = {
  dream: {"본점 V": 24000, "본점 A": 18000, "본점 B": 17000, "본점 C": 15000, "연대점 R": 24000, "연대점 Q": 22000, "연대점 F": 16000},
  startree: {V: 21000, R: 19000, Y: 18000, T: 14000, J: 14000}
};

function pad2(n) { return ("0" + n).slice(-2); }
function bookPrice(f) {
  var p = (BOOK_PRICE[f.site] || {})[f.room] || 0;
  return f.end > f.start ? p * (f.end - f.start) : 0;
}
function bookAmountText(n) { return n ? Number(n).toLocaleString("ko-KR") : ""; }

// 추천 시간 > 시간 칸 > 기본 14~16시 순으로 시작·끝 시간을 정한다
function bookInit(d) {
  var s = 14, e = 16;
  var m = String(d.suggest || "").match(/(\d{1,2})(?::(\d{2}))?\s*[~\-]\s*(\d{1,2})(?::(\d{2}))?/) ||
          String(d.time || "").match(/(\d{1,2})(?::(\d{2}))?\s*[~\-]\s*(\d{1,2})(?::(\d{2}))?/);
  if (m) {
    s = Math.max(9, Math.min(23, Number(m[1])));
    e = Math.max(s + 1, Math.min(24, Number(m[3]) + (Number(m[4] || 0) > 0 ? 1 : 0)));
  }
  var f = {site: "dream", room: BOOK_ROOMS.dream[0], start: s, end: e, amount: 0};
  var sg = smartSuggest(d);
  if (sg) {
    f.start = Math.max(9, Math.min(23, sg.s));
    f.end = Math.max(f.start + 1, Math.min(24, sg.e));
    var r0 = sg.rooms[0] || "";
    if (/룸$/.test(r0)) {
      var rn = r0.replace(/룸$/, "").trim();
      if (BOOK_ROOMS.startree.indexOf(rn) !== -1) { f.site = "startree"; f.room = rn; }
    } else if (BOOK_ROOMS.dream.indexOf(r0) !== -1) {
      f.room = r0;
    }
  }
  f.amount = bookPrice(f);
  return f;
}

function bookFormInner() {
  var f = bookForm;
  function opt(v, label, cur) {
    return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? " selected" : "") + ">" + esc(label) + "</option>";
  }
  function hours(cur) {
    var o = [];
    for (var h = 9; h <= 24; h++) o.push(opt(h, pad2(h) + ":00", cur));
    return o.join("");
  }
  return '<div class="r"><span class="lb">합주실</span><select data-bk="site">' +
      BOOK_SITES.map(function (s) { return opt(s.v, s.n, f.site); }).join("") + "</select></div>" +
    '<div class="r"><span class="lb">방</span><select data-bk="room">' +
      BOOK_ROOMS[f.site].map(function (r) { return opt(r, f.site === "startree" ? r + "룸" : r, f.room); }).join("") + "</select></div>" +
    '<div class="r"><span class="lb">시간</span><select data-bk="start">' + hours(f.start) + '</select><span class="sep">~</span>' +
      '<select data-bk="end">' + hours(f.end) + "</select></div>" +
    '<div class="r"><span class="lb">금액</span><input data-bk="amount" inputmode="numeric" placeholder="0" autocomplete="off" value="' +
      esc(bookAmountText(f.amount)) + '"></div>' +
    '<button class="bksave" data-booksave="1"' + (bookSaving ? " disabled" : "") + ">저장</button>";
}

// 관리자에게만, 아직 예약 완료가 아닌 날짜 카드 맨 아래에 붙는다
function bookUi(d) {
  if (!ADMIN || d.status === "예약 완료") return "";
  var open = bookingOpenRow === d.row && bookForm;
  return '<button class="bkbtn" data-book="' + d.row + '">' + (open ? "닫기" : "예약 완료 처리") + "</button>" +
    (open ? '<div class="bkform" data-row="' + d.row + '">' +
      '<div class="checked" style="margin:0 0 8px">빈방 기준 ' + esc(DATA && DATA.checkedAt || "확인 전") +
      ". 오래됐으면 맨 위 '빈방 새로고침'을 먼저 눌러 주세요.</div>" + bookFormInner() + "</div>" : "");
}

function saveBooking() {
  if (bookSaving || !bookForm || !DATA || !bookingOpenRow) return;
  var f = bookForm, row = bookingOpenRow, date = "";
  DATA.dates.forEach(function (x) { if (x.row === row) date = x.date; });
  if (!date) { toast("날짜를 찾지 못했어요. 새로고침해 주세요"); return; }
  if (!(f.end > f.start)) { toast("끝 시간이 시작보다 늦어야 해요"); return; }
  bookSaving = true;
  [].forEach.call(document.querySelectorAll(".bksave"), function (b) { b.disabled = true; });
  var body = {action: "book", a: ADMIN, row: row, date: date, site: f.site, room: f.room, start: f.start, end: f.end, amount: f.amount};
  fetch(API, {method: "POST", body: JSON.stringify(body)})
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) throw new Error(d.error);
      bookingOpenRow = 0;
      bookForm = null;
      DATA = d;
      render();
      renderInfo();
      toast(d.already ? "이미 기록된 예약이에요" : "예약 완료로 표시했어요");
    })
    .catch(function (e) { toast(e.message || "저장하지 못했어요"); })
    .then(function () {
      bookSaving = false;
      [].forEach.call(document.querySelectorAll(".bksave"), function (b) { b.disabled = false; });
    });
}

document.addEventListener("change", function (ev) {
  var sel = ev.target.closest(".bkform select");
  if (!sel || !bookForm) return;
  var k = sel.getAttribute("data-bk");
  if (k === "site") { bookForm.site = sel.value; bookForm.room = BOOK_ROOMS[sel.value][0]; }
  else if (k === "room") bookForm.room = sel.value;
  else bookForm[k] = Number(sel.value);
  bookForm.amount = bookPrice(bookForm);
  var form = sel.closest(".bkform");
  if (k === "site") { form.innerHTML = bookFormInner(); return; }
  form.querySelector('[data-bk="amount"]').value = bookAmountText(bookForm.amount);
});

document.addEventListener("input", function (ev) {
  var inp = ev.target.closest(".bkform input");
  if (!inp || !bookForm) return;
  bookForm.amount = Number(String(inp.value).replace(/[^0-9]/g, "")) || 0;
  inp.value = bookAmountText(bookForm.amount);
});

document.addEventListener("click", function (ev) {
  var tg = ev.target.closest("[data-book]");
  if (tg && ADMIN && DATA) {
    var row = Number(tg.getAttribute("data-book"));
    if (bookingOpenRow === row) { bookingOpenRow = 0; bookForm = null; }
    else {
      var cur = null;
      DATA.dates.forEach(function (x) { if (x.row === row) cur = x; });
      if (!cur) return;
      bookingOpenRow = row;
      bookForm = bookInit(cur);
    }
    render();
    return;
  }
  if (ev.target.closest("[data-booksave]")) saveBooking();
});

document.getElementById("amount").addEventListener("input", function () { setAmount(amountValue()); });
window.addEventListener("hashchange", function () { if (/admin=/.test(location.hash)) location.reload(); });

document.addEventListener("click", function (ev) {
  var t = ev.target;
  var tab = t.closest(".tab");
  if (tab) { showTab(tab.getAttribute("data-tab")); return; }
  if (t.closest("#undo")) { undoDues(); return; }
  if (!DUES) return;
  var seg = t.closest(".seg button");
  if (seg) { dtype = seg.getAttribute("data-type"); renderDues(); return; }
  var q = t.closest("#quick button");
  if (q) { setAmount(q.getAttribute("data-amt")); return; }
  var c = t.closest("[data-cat]");
  if (c) { cat = c.getAttribute("data-cat"); renderDues(); return; }
  var p = t.closest("[data-payer]");
  if (p) { payer = payer === p.getAttribute("data-payer") ? "" : p.getAttribute("data-payer"); renderDues(); return; }
  if (t.closest("#save")) saveDues();
});

load(false);
</script>
</body>
